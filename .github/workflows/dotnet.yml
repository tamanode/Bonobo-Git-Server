name: Build Bonobo Git Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: bonobo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bonobo for IIS
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      SOLUTION: Bonobo.Git.Server.sln
      WEB_PROJECT: Bonobo.Git.Server\Bonobo.Git.Server.csproj

      BUILD_DIR: ${{ github.workspace }}\artifacts\build\
      SITE_DIR: ${{ github.workspace }}\artifacts\build\_PublishedWebsites\Bonobo.Git.Server

      SQLITE_ROOT: ${{ github.workspace }}\packages\System.Data.SQLite.Core.1.0.104.0\build\net46

      ZIP_NAME: Bonobo.Git.Server-Release.zip

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------
      # Validate environment
      # ---------------------------------------------------------

      - name: Verify runner and repository structure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          if ($env:RUNNER_OS -ne "Windows") {
              throw "Expected Windows runner, got: $env:RUNNER_OS"
          }

          if (-not (Test-Path $env:SOLUTION -PathType Leaf)) {
              Write-Host "Repository contents:"
              Get-ChildItem -Force

              throw "Solution not found: $env:SOLUTION"
          }

          if (-not (Test-Path $env:WEB_PROJECT -PathType Leaf)) {
              Write-Host "Repository contents:"
              Get-ChildItem -Force

              throw "Web project not found: $env:WEB_PROJECT"
          }

          Write-Host "Repository structure verified."
          Write-Host "Solution: $env:SOLUTION"
          Write-Host "Project: $env:WEB_PROJECT"

      # ---------------------------------------------------------
      # Build tools
      # ---------------------------------------------------------

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Setup Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # ---------------------------------------------------------
      # .NET Framework 4.6
      # ---------------------------------------------------------

      - name: Install and verify .NET Framework 4.6 Developer Pack
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $frameworkPath = Join-Path `
              ${env:ProgramFiles(x86)} `
              "Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6"

          if (-not (Test-Path $frameworkPath)) {
              Write-Host "Installing .NET Framework 4.6 Developer Pack..."

              choco install netfx-4.6-devpack `
                  --version=4.6.81 `
                  --yes `
                  --no-progress `
                  --limit-output

              if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
                  throw "Developer Pack installation failed with exit code $LASTEXITCODE"
              }
          }

          $mscorlibPath = Join-Path `
              $frameworkPath `
              "mscorlib.dll"

          if (-not (Test-Path $mscorlibPath -PathType Leaf)) {
              throw ".NET Framework 4.6 reference assemblies not found: $frameworkPath"
          }

          Write-Host ".NET Framework 4.6 targeting pack verified."

      # ---------------------------------------------------------
      # Tool versions
      # ---------------------------------------------------------

      - name: Display build tool versions
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "MSBuild version:"
          msbuild -version

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild is unavailable."
          }

          Write-Host ""
          Write-Host "NuGet version:"
          nuget help | Select-Object -First 1

      # ---------------------------------------------------------
      # Restore packages
      # ---------------------------------------------------------

      - name: Restore NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          nuget restore $env:SOLUTION `
              -NonInteractive `
              -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed with exit code $LASTEXITCODE"
          }

      # ---------------------------------------------------------
      # Validate SQLite package
      # ---------------------------------------------------------

      - name: Verify SQLite native libraries
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sqliteX86 = Join-Path `
              $env:SQLITE_ROOT `
              "x86\SQLite.Interop.dll"

          $sqliteX64 = Join-Path `
              $env:SQLITE_ROOT `
              "x64\SQLite.Interop.dll"

          Write-Host "SQLite package:"
          Write-Host $env:SQLITE_ROOT
          Write-Host ""

          if (-not (Test-Path $sqliteX86 -PathType Leaf)) {
              throw "SQLite x86 native library not found: $sqliteX86"
          }

          if (-not (Test-Path $sqliteX64 -PathType Leaf)) {
              throw "SQLite x64 native library not found: $sqliteX64"
          }

          $x86File = Get-Item $sqliteX86
          $x64File = Get-Item $sqliteX64

          Write-Host "SQLite x86:"
          Write-Host $x86File.FullName
          Write-Host "Size: $($x86File.Length) bytes"
          Write-Host ""

          Write-Host "SQLite x64:"
          Write-Host $x64File.FullName
          Write-Host "Size: $($x64File.Length) bytes"

      # ---------------------------------------------------------
      # Prepare build output
      # ---------------------------------------------------------

      - name: Prepare output directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifacts"

          if (Test-Path $artifactRoot) {
              Remove-Item `
                  -Path $artifactRoot `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $env:BUILD_DIR `
              -Force |
              Out-Null

          Write-Host "Build output:"
          Write-Host $env:BUILD_DIR

      # ---------------------------------------------------------
      # Build Bonobo
      # ---------------------------------------------------------

      - name: Build web project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
              $env:WEB_PROJECT
              "/m"
              "/t:Rebuild"
              "/p:Configuration=Release"
              "/p:Platform=AnyCPU"
              "/p:OutDir=$env:BUILD_DIR"
              "/p:DebugSymbols=false"
              "/p:DebugType=None"
              "/p:UseSharedCompilation=false"
              "/nr:false"
              "/v:minimal"
          )

          & msbuild @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      # ---------------------------------------------------------
      # Copy SQLite native DLLs
      # ---------------------------------------------------------

      - name: Add SQLite native libraries to IIS application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sourceX86 = Join-Path `
              $env:SQLITE_ROOT `
              "x86\SQLite.Interop.dll"

          $sourceX64 = Join-Path `
              $env:SQLITE_ROOT `
              "x64\SQLite.Interop.dll"

          $destinationX86 = Join-Path `
              $env:SITE_DIR `
              "bin\x86"

          $destinationX64 = Join-Path `
              $env:SITE_DIR `
              "bin\x64"

          if (-not (Test-Path $sourceX86 -PathType Leaf)) {
              throw "SQLite x86 source library not found: $sourceX86"
          }

          if (-not (Test-Path $sourceX64 -PathType Leaf)) {
              throw "SQLite x64 source library not found: $sourceX64"
          }

          New-Item `
              -ItemType Directory `
              -Path $destinationX86 `
              -Force |
              Out-Null

          New-Item `
              -ItemType Directory `
              -Path $destinationX64 `
              -Force |
              Out-Null

          Copy-Item `
              -Path $sourceX86 `
              -Destination (Join-Path $destinationX86 "SQLite.Interop.dll") `
              -Force

          Copy-Item `
              -Path $sourceX64 `
              -Destination (Join-Path $destinationX64 "SQLite.Interop.dll") `
              -Force

          Write-Host "SQLite native libraries copied."
          Write-Host ""
          Write-Host "x86:"
          Write-Host "$destinationX86\SQLite.Interop.dll"
          Write-Host ""
          Write-Host "x64:"
          Write-Host "$destinationX64\SQLite.Interop.dll"

      # ---------------------------------------------------------
      # Validate complete IIS application
      # ---------------------------------------------------------

      - name: Validate IIS application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $webConfig = Join-Path `
              $env:SITE_DIR `
              "Web.config"

          $binDir = Join-Path `
              $env:SITE_DIR `
              "bin"

          $sqliteX86 = Join-Path `
              $binDir `
              "x86\SQLite.Interop.dll"

          $sqliteX64 = Join-Path `
              $binDir `
              "x64\SQLite.Interop.dll"

          if (-not (Test-Path $webConfig -PathType Leaf)) {
              throw "Web.config not found: $webConfig"
          }

          if (-not (Test-Path $binDir -PathType Container)) {
              throw "bin directory not found: $binDir"
          }

          $dllFiles = @(
              Get-ChildItem `
                  -Path $binDir `
                  -Filter "*.dll" `
                  -File
          )

          if ($dllFiles.Count -eq 0) {
              throw "No managed DLL files found in: $binDir"
          }

          if (-not (Test-Path $sqliteX86 -PathType Leaf)) {
              throw "SQLite x86 native library missing: $sqliteX86"
          }

          if (-not (Test-Path $sqliteX64 -PathType Leaf)) {
              throw "SQLite x64 native library missing: $sqliteX64"
          }

          $sourceFiles = @(
              Get-ChildItem `
                  -Path $env:SITE_DIR `
                  -Filter "*.cs" `
                  -File `
                  -Recurse
          )

          if ($sourceFiles.Count -gt 0) {
              throw "C# source files found in deployment output."
          }

          $allFiles = @(
              Get-ChildItem `
                  -Path $env:SITE_DIR `
                  -File `
                  -Recurse
          )

          Write-Host ""
          Write-Host "========================================="
          Write-Host "IIS APPLICATION VALIDATION PASSED"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "Total files: $($allFiles.Count)"
          Write-Host "Managed DLL files: $($dllFiles.Count)"
          Write-Host ""
          Write-Host "SQLite x86: OK"
          Write-Host $sqliteX86
          Write-Host ""
          Write-Host "SQLite x64: OK"
          Write-Host $sqliteX64

      # ---------------------------------------------------------
      # Create deployment package
      # ---------------------------------------------------------

      - name: Create deployment ZIP and checksum
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              $env:ZIP_NAME

          $hashPath = "$zipPath.sha256.txt"

          if (Test-Path $zipPath) {
              Remove-Item `
                  -Path $zipPath `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $env:SITE_DIR "*") `
              -DestinationPath $zipPath `
              -CompressionLevel Optimal `
              -Force

          if (-not (Test-Path $zipPath -PathType Leaf)) {
              throw "Deployment ZIP was not created."
          }

          $zipFile = Get-Item $zipPath

          if ($zipFile.Length -le 0) {
              throw "Deployment ZIP is empty."
          }

          $hash = (
              Get-FileHash `
                  -Path $zipPath `
                  -Algorithm SHA256
          ).Hash

          "$hash  $env:ZIP_NAME" |
              Set-Content `
                  -Path $hashPath `
                  -Encoding ascii

          Write-Host ""
          Write-Host "========================================="
          Write-Host "DEPLOYMENT PACKAGE CREATED"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "ZIP: $zipPath"
          Write-Host "Size: $($zipFile.Length) bytes"
          Write-Host "SHA256: $hash"

      # ---------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------

      - name: Upload IIS deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bonobo-Git-Server-Release
          path: |
            Bonobo.Git.Server-Release.zip
            Bonobo.Git.Server-Release.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
