name: Build Bonobo Git Server

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: bonobo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bonobo for IIS
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      WEB_PROJECT: Bonobo.Git.Server\Bonobo.Git.Server.csproj
      SOLUTION: Bonobo.Git.Server.sln
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\Bonobo.Git.Server

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner and repository structure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          if ($env:RUNNER_OS -ne "Windows") {
              throw "Expected Windows runner, got: $env:RUNNER_OS"
          }

          if (-not (Test-Path $env:SOLUTION -PathType Leaf)) {
              Write-Host "Repository root contents:"
              Get-ChildItem -Force

              throw "Solution not found: $env:SOLUTION"
          }

          if (-not (Test-Path $env:WEB_PROJECT -PathType Leaf)) {
              Write-Host "Repository file structure:"
              Get-ChildItem -Recurse -Depth 2 |
                  Select-Object FullName

              throw "Web project not found: $env:WEB_PROJECT"
          }

          Write-Host "Repository structure verified."
          Write-Host "Solution: $env:SOLUTION"
          Write-Host "Web project: $env:WEB_PROJECT"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Setup Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install and verify .NET Framework 4.6 Developer Pack
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $frameworkPath = Join-Path `
              ${env:ProgramFiles(x86)} `
              "Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6"

          if (-not (Test-Path $frameworkPath)) {
              Write-Host "Installing .NET Framework 4.6 Developer Pack..."

              choco install netfx-4.6-devpack `
                  --version=4.6.81 `
                  --yes `
                  --no-progress `
                  --limit-output

              $chocoExitCode = $LASTEXITCODE

              if ($chocoExitCode -notin @(0, 1641, 3010)) {
                  throw "Developer Pack installation failed with exit code $chocoExitCode."
              }
          }
          else {
              Write-Host ".NET Framework 4.6 Developer Pack already installed."
          }

          $mscorlibPath = Join-Path $frameworkPath "mscorlib.dll"

          if (-not (Test-Path $mscorlibPath -PathType Leaf)) {
              throw ".NET Framework 4.6 reference assemblies not found: $frameworkPath"
          }

          Write-Host ".NET Framework 4.6 targeting pack verified:"
          Write-Host $frameworkPath

      - name: Display build tool versions
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "MSBuild version:"
          msbuild -version

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild is unavailable."
          }

          Write-Host "NuGet version:"
          nuget help | Select-Object -First 1

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet is unavailable."
          }

      - name: Restore NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          nuget restore $env:SOLUTION `
              -NonInteractive `
              -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed with exit code $LASTEXITCODE."
          }

      - name: Prepare publish directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Split-Path $env:PUBLISH_DIR -Parent

          if (Test-Path $artifactRoot) {
              Remove-Item $artifactRoot -Recurse -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $env:PUBLISH_DIR `
              -Force |
              Out-Null

          Write-Host "Publish directory:"
          Write-Host $env:PUBLISH_DIR

      - name: Build and publish web project only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          msbuild $env:WEB_PROJECT `
              /m `
              /t:Rebuild `
              /p:Configuration=Release `
              /p:Platform=AnyCPU `
              /p:DeployOnBuild=true `
              /p:WebPublishMethod=FileSystem `
              /p:DeleteExistingFiles=true `
              /p:publishUrl="$env:PUBLISH_DIR" `
              /p:DebugSymbols=false `
              /p:DebugType=None `
              /p:AutoParameterizationWebConfigConnectionStrings=false `
              /p:UseSharedCompilation=false `
              /nr:false `
              /v:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Validate published application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $webConfig = Join-Path $env:PUBLISH_DIR "Web.config"
          $binPath = Join-Path $env:PUBLISH_DIR "bin"

          if (-not (Test-Path $webConfig -PathType Leaf)) {
              throw "Published Web.config not found: $webConfig"
          }

          if (-not (Test-Path $binPath -PathType Container)) {
              throw "Published bin directory not found: $binPath"
          }

          $assemblies = @(
              Get-ChildItem `
                  -Path $binPath `
                  -Filter "*.dll" `
                  -File `
                  -ErrorAction Stop
          )

          if ($assemblies.Count -eq 0) {
              throw "No DLL files found in published bin directory."
          }

          $publishedFiles = @(
              Get-ChildItem `
                  -Path $env:PUBLISH_DIR `
                  -File `
                  -Recurse `
                  -ErrorAction Stop
          )

          if ($publishedFiles.Count -eq 0) {
              throw "Publish directory is empty."
          }

          Write-Host "Publish validation successful."
          Write-Host "Published files: $($publishedFiles.Count)"
          Write-Host "Published assemblies: $($assemblies.Count)"

      - name: Create deployment ZIP and checksum
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "Bonobo.Git.Server-Release.zip"

          $hashPath = "$zipPath.sha256.txt"

          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }

          Compress-Archive `
              -Path (Join-Path $env:PUBLISH_DIR "*") `
              -DestinationPath $zipPath `
              -CompressionLevel Optimal `
              -Force

          if (-not (Test-Path $zipPath -PathType Leaf)) {
              throw "Deployment ZIP was not created."
          }

          $zipFile = Get-Item $zipPath

          if ($zipFile.Length -eq 0) {
              throw "Deployment ZIP is empty."
          }

          $hash = (
              Get-FileHash `
                  -Path $zipPath `
                  -Algorithm SHA256
          ).Hash

          "$hash  Bonobo.Git.Server-Release.zip" |
              Set-Content `
                  -Path $hashPath `
                  -Encoding ascii

          Write-Host "Deployment package created:"
          Write-Host $zipFile.FullName
          Write-Host "Size: $($zipFile.Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Upload IIS deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bonobo-Git-Server-Release
          path: |
            Bonobo.Git.Server-Release.zip
            Bonobo.Git.Server-Release.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
