      - name: Prepare output directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"

          if (Test-Path $artifactRoot) {
              Remove-Item $artifactRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $env:PUBLISH_DIR -Force | Out-Null

          Write-Host "Artifact root: $artifactRoot"
          Write-Host "Publish directory: $env:PUBLISH_DIR"

      - name: Build web project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
              $env:WEB_PROJECT
              "/m"
              "/t:Rebuild"
              "/p:Configuration=Release"
              "/p:Platform=AnyCPU"
              "/p:DeployOnBuild=true"
              "/p:WebPublishMethod=Package"
              "/p:PackageAsSingleFile=false"
              "/p:SkipInvalidConfigurations=true"
              "/p:DebugSymbols=false"
              "/p:DebugType=None"
              "/p:UseSharedCompilation=false"
              "/nr:false"
              "/v:minimal"
          )

          & msbuild @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Find deployment output
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $projectRoot = Join-Path $env:GITHUB_WORKSPACE "Bonobo.Git.Server"
          $packageTmp = Join-Path $projectRoot "obj\Release\Package\PackageTmp"

          Write-Host "Project root:"
          Write-Host $projectRoot

          Write-Host "Looking for PackageTmp:"
          Write-Host $packageTmp

          if (Test-Path $packageTmp -PathType Container) {
              Write-Host "PackageTmp found."

              Copy-Item -Path "$packageTmp\*" `
                        -Destination $env:PUBLISH_DIR `
                        -Recurse `
                        -Force
          }
          else {
              Write-Host "PackageTmp not found."
              Write-Host "Searching for Web.config under obj\Release..."

              $objRelease = Join-Path $projectRoot "obj\Release"

              Get-ChildItem -Path $objRelease `
                            -Filter "Web.config" `
                            -File `
                            -Recurse `
                            -ErrorAction SilentlyContinue |
                  Select-Object FullName

              throw "MSBuild completed but PackageTmp was not generated."
          }

      - name: Validate IIS deployment files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $webConfig = Join-Path $env:PUBLISH_DIR "Web.config"
          $binDirectory = Join-Path $env:PUBLISH_DIR "bin"

          if (-not (Test-Path $webConfig -PathType Leaf)) {
              Write-Host "Publish directory contents:"

              Get-ChildItem -Path $env:PUBLISH_DIR `
                            -Recurse `
                            -Force |
                  Select-Object FullName

              throw "Web.config not found in deployment output."
          }

          if (-not (Test-Path $binDirectory -PathType Container)) {
              throw "bin directory not found in deployment output."
          }

          $dllFiles = @(
              Get-ChildItem -Path $binDirectory `
                            -Filter "*.dll" `
                            -File
          )

          if ($dllFiles.Count -eq 0) {
              throw "No DLL files found in deployment bin directory."
          }

          $sourceFiles = @(
              Get-ChildItem -Path $env:PUBLISH_DIR `
                            -Filter "*.cs" `
                            -File `
                            -Recurse
          )

          if ($sourceFiles.Count -gt 0) {
              throw "C# source files were included in deployment output."
          }

          $allFiles = @(
              Get-ChildItem -Path $env:PUBLISH_DIR `
                            -File `
                            -Recurse
          )

          Write-Host "Deployment validation passed."
          Write-Host "Total files: $($allFiles.Count)"
          Write-Host "DLL files: $($dllFiles.Count)"
          Write-Host "Web.config: $webConfig"

      - name: Create deployment ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "Bonobo.Git.Server-Release.zip"

          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "$env:PUBLISH_DIR\*" `
                           -DestinationPath $zipPath `
                           -CompressionLevel Optimal

          if (-not (Test-Path $zipPath -PathType Leaf)) {
              throw "Deployment ZIP was not created."
          }

          $zipFile = Get-Item $zipPath

          if ($zipFile.Length -le 0) {
              throw "Deployment ZIP is empty."
          }

          $hash = Get-FileHash -Path $zipPath -Algorithm SHA256
          $hashPath = "$zipPath.sha256.txt"

          "$($hash.Hash)  Bonobo.Git.Server-Release.zip" |
              Set-Content -Path $hashPath -Encoding ascii

          Write-Host "Deployment ZIP created successfully."
          Write-Host "File: $zipPath"
          Write-Host "Size: $($zipFile.Length) bytes"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload IIS deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bonobo-Git-Server-Release
          path: |
            Bonobo.Git.Server-Release.zip
            Bonobo.Git.Server-Release.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
