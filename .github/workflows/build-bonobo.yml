name: Build Bonobo Git Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: bonobo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bonobo for IIS
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      SOLUTION: Bonobo.Git.Server.sln
      WEB_PROJECT: Bonobo.Git.Server\Bonobo.Git.Server.csproj
      BUILD_DIR: ${{ github.workspace }}\artifacts\build\
      SITE_DIR: ${{ github.workspace }}\artifacts\build\_PublishedWebsites\Bonobo.Git.Server
      ZIP_NAME: Bonobo.Git.Server-Release.zip

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner and repository structure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          if ($env:RUNNER_OS -ne "Windows") {
              throw "Expected Windows runner, got: $env:RUNNER_OS"
          }
          if (-not (Test-Path $env:SOLUTION -PathType Leaf)) {
              Get-ChildItem -Force
              throw "Solution not found: $env:SOLUTION"
          }
          if (-not (Test-Path $env:WEB_PROJECT -PathType Leaf)) {
              Get-ChildItem -Force
              throw "Web project not found: $env:WEB_PROJECT"
          }
          Write-Host "Repository structure verified."

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Setup Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install and verify .NET Framework 4.6 Developer Pack
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $frameworkPath = Join-Path ${env:ProgramFiles(x86)} "Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6"
          if (-not (Test-Path $frameworkPath)) {
              Write-Host "Installing .NET Framework 4.6 Developer Pack..."
              choco install netfx-4.6-devpack --version=4.6.81 --yes --no-progress --limit-output
              if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
                  throw "Developer Pack installation failed with exit code $LASTEXITCODE"
              }
          }
          if (-not (Test-Path (Join-Path $frameworkPath "mscorlib.dll") -PathType Leaf)) {
              throw ".NET Framework 4.6 reference assemblies not found: $frameworkPath"
          }
          Write-Host ".NET Framework 4.6 targeting pack verified."

      - name: Display build tool versions
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          msbuild -version
          if ($LASTEXITCODE -ne 0) { throw "MSBuild is unavailable." }

      - name: Restore NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          nuget restore $env:SOLUTION -NonInteractive -Verbosity normal
          if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed with exit code $LASTEXITCODE"
          }

      - name: Prepare output directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          if (Test-Path $artifactRoot) {
              Remove-Item -Path $artifactRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:BUILD_DIR -Force | Out-Null
          Write-Host "Build output: $env:BUILD_DIR"

      - name: Build web project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $arguments = @(
              $env:WEB_PROJECT
              "/m"
              "/t:Rebuild"
              "/p:Configuration=Release"
              "/p:Platform=AnyCPU"
              "/p:OutDir=$env:BUILD_DIR"
              "/p:DebugSymbols=false"
              "/p:DebugType=None"
              "/p:UseSharedCompilation=false"
              "/nr:false"
              "/v:minimal"
          )
          & msbuild @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Validate IIS application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $webConfig = Join-Path $env:SITE_DIR "Web.config"
          $binDir = Join-Path $env:SITE_DIR "bin"

          if (-not (Test-Path $webConfig -PathType Leaf)) {
              Write-Host "Web.config files found under artifacts:"
              Get-ChildItem -Path $env:BUILD_DIR -Filter "Web.config" -File -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
              throw "Web.config not found: $webConfig"
          }
          if (-not (Test-Path $binDir -PathType Container)) {
              throw "bin directory not found: $binDir"
          }

          $dllFiles = @(Get-ChildItem -Path $binDir -Filter "*.dll" -File)
          if ($dllFiles.Count -eq 0) {
              throw "No DLL files found in: $binDir"
          }

          $sourceFiles = @(Get-ChildItem -Path $env:SITE_DIR -Filter "*.cs" -File -Recurse)
          if ($sourceFiles.Count -gt 0) {
              throw "C# source files found in deployment output."
          }

          $allFiles = @(Get-ChildItem -Path $env:SITE_DIR -File -Recurse)
          Write-Host "IIS application validation passed."
          Write-Host "Total files: $($allFiles.Count)"
          Write-Host "DLL files: $($dllFiles.Count)"

      - name: Create deployment ZIP and checksum
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $env:ZIP_NAME
          $hashPath = "$zipPath.sha256.txt"

          if (Test-Path $zipPath) {
              Remove-Item -Path $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $env:SITE_DIR "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $zipFile = Get-Item $zipPath
          if ($zipFile.Length -le 0) {
              throw "Deployment ZIP is empty."
          }

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  $env:ZIP_NAME" | Set-Content -Path $hashPath -Encoding ascii

          Write-Host "ZIP: $zipPath"
          Write-Host "Size: $($zipFile.Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Upload IIS deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bonobo-Git-Server-Release
          path: |
            Bonobo.Git.Server-Release.zip
            Bonobo.Git.Server-Release.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
